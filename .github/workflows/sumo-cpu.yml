name: Sumo CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/cpu-test.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/cpu-test.txt
      - name: Metadata checks
        run: python scripts/reinforcement_learning/harl/sumo_doctor.py --cpu-only
      - name: Unit and mock-simulator integration tests
        run: python -m unittest discover -s scripts/reinforcement_learning/harl -p 'test_*.py' -v
