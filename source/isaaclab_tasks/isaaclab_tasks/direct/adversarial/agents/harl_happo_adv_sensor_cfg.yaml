seed:
  seed_specify: true
  seed: 1
device:
  cuda: true
  cuda_deterministic: true
  torch_threads: 16
train:
  n_rollout_threads: 256
  num_env_steps: 10000000
  episode_length: 200
  log_interval: 1
  eval_interval: 25
  use_valuenorm: true
  use_linear_lr_decay: false
  use_proper_time_limits: true
  save_checkpoints: true
  checkpoint_interval: 100
  model_dir:
eval:
  use_eval: false
  n_eval_rollout_threads: 10
  eval_episodes: 20
render:
  use_render: false
  render_episodes: 10
model:
  hidden_sizes: [256, 256]
  activation_func: relu
  use_feature_normalization: true
  initialization_method: orthogonal_
  gain: 0.01
  use_naive_recurrent_policy: false
  use_recurrent_policy: false
  recurrent_n: 1
  data_chunk_length: 10
  lr: 0.0003
  critic_lr: 0.0003
  opti_eps: 0.00001
  weight_decay: 0
  std_x_coef: 1
  std_y_coef: 0.5
algo:
  ppo_epoch: 5
  critic_epoch: 5
  use_clipped_value_loss: true
  clip_param: 0.2
  actor_num_mini_batch: 2
  critic_num_mini_batch: 2
  entropy_coef: 0.01
  value_loss_coef: 1
  use_max_grad_norm: true
  max_grad_norm: 1.0
  use_gae: true
  gamma: 0.99
  gae_lambda: 0.95
  use_huber_loss: true
  use_policy_active_masks: true
  huber_delta: 10.0
  action_aggregation: prod
  share_param: false
  fixed_order: true
  adversarial_training_mode: parallel
  adversarial_training_iterations: 50000000
logger:
  log_dir: ./results
